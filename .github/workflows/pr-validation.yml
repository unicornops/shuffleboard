name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pmd:
    name: PMD Static Analysis
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PMD
        run: brew install pmd

      # NOTE: `pmd check` (static analysis) is intentionally omitted.
      # PMD's Swift grammar predates Swift 5.9 and cannot parse existential
      # types (any Encodable), if/switch expressions, or async/await signatures
      # — all of which are used throughout this codebase. Running `pmd check`
      # produces dozens of spurious ANTLR parse warnings and an NPE in the
      # UnavailableFunction rule. See pmd-ruleset.xml for full details and the
      # commented-out rule references to re-enable when PMD's grammar catches up.

      - name: Run PMD CPD (copy-paste detection)
        run: |
          pmd cpd \
            --minimum-tokens 105 \
            --dir Shuffleboard \
            --language swift \
            --format text \
            --fail-on-violation \
            --report-file cpd-report.txt || CPD_EXIT=$?

          if [ -f cpd-report.txt ] && [ -s cpd-report.txt ]; then
            echo "### CPD duplications found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat cpd-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat cpd-report.txt
          fi

          exit ${CPD_EXIT:-0}

      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmd-reports
          path: cpd-report.txt
          if-no-files-found: ignore

  lint:
    name: SwiftLint and SwiftFormat
    runs-on: ubuntu-latest
    env:
      # Pinned so a new linter release can't start failing every PR; bump deliberately.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
      SWIFTFORMAT_VERSION: 0.63.1
      SWIFTFORMAT_SHA256: 9e10090e0213378c68cedb42adc2c6461916a9c8e457cf452b5585b84096c333
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint and SwiftFormat
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"

          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | sha256sum -c -
          unzip -q swiftlint.zip -d swiftlint
          install -m 755 swiftlint/swiftlint "$bin/swiftlint"

          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | sha256sum -c -
          unzip -q swiftformat.zip -d swiftformat
          install -m 755 swiftformat/swiftformat_linux "$bin/swiftformat"

          echo "$bin" >> "$GITHUB_PATH"

      - name: SwiftFormat
        run: swiftformat --lint --config .swiftformat .

      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml --reporter github-actions-logging

  build:
    name: Build and Test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode version
        run: |
          XCODE_PATH=$(ls -td /Applications/Xcode_*.app 2>/dev/null | head -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show build environment
        run: |
          echo "Xcode version:"
          xcodebuild -version
          echo ""
          echo "Swift version:"
          swift --version
          echo ""
          echo "macOS version:"
          sw_vers

      - name: Validate project structure
        run: |
          echo "Checking project file..."
          if [ ! -f "Shuffleboard.xcodeproj/project.pbxproj" ]; then
            echo "❌ Project file not found"
            exit 1
          fi
          echo "✓ Project file exists"

      - name: Check Swift syntax
        run: |
          echo "Checking Swift files for syntax errors..."
          find Shuffleboard -name "*.swift" -type f | while read file; do
            echo "Checking: $file"
            if ! swift -frontend -parse "$file" > /dev/null 2>&1; then
              echo "❌ Syntax error in: $file"
              swift -frontend -parse "$file"
              exit 1
            fi
          done
          echo "✓ All Swift files have valid syntax"

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project Shuffleboard.xcodeproj \
            -scheme Shuffleboard \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GIT_COMMIT_HASH="${{ github.sha }}" \
            BUILD_REF="${{ github.sha }}" \
            BUILD_DATE_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # Unit tests run inside the app (TEST_HOST), so the app is ad-hoc signed ("-") rather than unsigned.
      - name: Run unit tests
        run: |
          xcodebuild \
            -project Shuffleboard.xcodeproj \
            -scheme Shuffleboard \
            -destination 'platform=macOS' \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: build/UnitTests.xcresult
          if-no-files-found: ignore

      - name: Build (Release - Unsigned)
        run: |
          xcodebuild \
            -project Shuffleboard.xcodeproj \
            -scheme Shuffleboard \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GIT_COMMIT_HASH="${{ github.sha }}" \
            BUILD_REF="${{ github.sha }}" \
            BUILD_DATE_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "Shuffleboard.app" -type d | head -n 1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Verify app bundle
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"

          if [ ! -d "$APP_PATH" ]; then
            echo "✗ App bundle not found"
            exit 1
          fi

          echo "✓ App bundle exists"

          if [ ! -f "$APP_PATH/Contents/MacOS/Shuffleboard" ]; then
            echo "✗ Executable not found"
            exit 1
          fi
          echo "✓ Executable found"

          if [ ! -f "$APP_PATH/Contents/Info.plist" ]; then
            echo "✗ Info.plist not found"
            exit 1
          fi
          echo "✓ Info.plist found"

      - name: PR validation summary
        if: always()
        run: |
          echo "## PR Validation Summary ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift Syntax**: Validated" >> $GITHUB_STEP_SUMMARY
          echo "- **Build (Debug)**: Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Build (Release)**: Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode**: $(xcodebuild -version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift**: $(swift --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS**: $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note**: This is an unsigned build. Signed builds are only created on release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **PMD CPD (copy-paste detection) results**: see the 'PMD Static Analysis' job above." >> $GITHUB_STEP_SUMMARY

name: End-to-end tests

# Runs Shuffleboard against a real Nextcloud server with the Deck app (#119).
#
# GitHub's macOS runners can't run Docker (no nested virtualisation on Apple silicon), so Nextcloud runs natively
# on the runner, behind Caddy for HTTPS. See scripts/e2e/. Two server profiles (#142):
#   minimal    PHP's built-in server and SQLite, with the e2e_early_params test app (URL parameters win).
#   realistic  nginx and php-fpm, MariaDB, Redis and APCu, at /nextcloud, with the app store apps many servers
#              have, a board of 300 cards, and no test app (its apps decide which parameters win).
#
# - Pull requests: the minimal server, on the newest Nextcloud major that Deck supports, with the newest Deck for it.
# - Daily, and on demand: both profiles on every Nextcloud major still getting releases (up to the newest Deck
#   supports), each with the newest Deck for it, plus the minimal server without the test app (the body's
#   parameters win) or the Activity app on the newest. When a scheduled run fails, e2e-rerun.yml runs its failed jobs
#   again once, and if they fail again it opens (or comments on) an issue, so a server release that breaks the app is
#   noticed, but a GitHub or app store outage on one runner isn't reported (#203).
# - Daily, and on demand ("all" or "pseudo-language"): the UI tests again on the newest, minimal server, with the app in
#   the double-length pseudo-language (#162), which shows every translated string twice, as long as a long
#   translation would be. Its screenshots (artifact "screenshots-pseudo-language") show any layout that cuts text off.
#   Not on pull requests: it takes as long as the UI tests themselves, and a change that breaks it is caught a day later.
# - Every run takes the README screenshots (artifact "screenshots"); on demand with "screenshots" it also opens a
#   pull request with them.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      nextcloud:
        description: 'Nextcloud: "all" (every supported major), "latest" (newest major Deck supports), a major ("35") or a release ("35.0.1")'
        default: all
      deck:
        description: "Deck release, e.g. 1.19.0 (default: the newest the app store has for that Nextcloud)"
        default: ""
      profile:
        description: "Server profile: all (minimal, realistic, minimal with body parameters winning and no Activity app, and minimal in the pseudo-language), minimal, realistic or pseudo-language (only the UI tests, in the pseudo-language)"
        type: choice
        options: [all, minimal, realistic, pseudo-language]
        default: all
      screenshots:
        description: "Take the README screenshots and open a pull request with them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Pick Nextcloud versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick versions
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event_name == 'pull_request' && 'latest' || inputs.nextcloud || 'all' }}
          PROFILE: ${{ github.event_name == 'pull_request' && 'minimal' || inputs.profile || 'all' }}
        run: |
          set -euo pipefail
          # The newest Nextcloud major the newest Deck release supports (its appinfo max-version): a new
          # Nextcloud major can only be tested once Deck has a release for it.
          deck=$(gh api repos/nextcloud/deck/releases/latest --jq .tag_name)
          newest=$(gh api "repos/nextcloud/deck/contents/appinfo/info.xml?ref=$deck" --jq .content | base64 -d |
            sed -n 's/.*<nextcloud [^>]*max-version="\([0-9]*\)".*/\1/p')
          echo "Deck $deck supports up to Nextcloud $newest"
          case "$REQUESTED" in
            all)
              # Every major with a release in the last four months (the ones Nextcloud still supports), up to $newest.
              since=$(date -u -d '120 days ago' +%Y-%m-%dT%H:%M:%SZ)
              versions=$(gh api 'repos/nextcloud/server/releases?per_page=100' --jq \
                "[.[] | select(.prerelease | not) | select(.published_at > \"$since\") | .tag_name | ltrimstr(\"v\") | split(\".\")[0] | tonumber]
                 | unique | map(select(. <= $newest)) | sort | reverse | map(tostring)")
              ;;
            latest) versions=$(jq -nc --arg v "$newest" '[$v]') ;;
            *) versions=$(jq -nc --arg v "$REQUESTED" '[$v]') ;;
          esac
          # One job per version and profile. "early_params" picks which value wins when a request has a parameter
          # in both the URL and the body: 1 the URL's (the test app), 0 the body's, "" whatever the server's apps do.
          # "pseudo" runs only the UI tests, with the app in the double-length pseudo-language (#162).
          matrix=$(jq -nc --argjson versions "$versions" --arg profile "$PROFILE" '
            [ $versions[] as $v
              | (if $profile == "all" or $profile == "minimal" then {nextcloud: $v, profile: "minimal", early_params: "1", name: ""} else empty end),
                (if $profile == "all" or $profile == "realistic" then {nextcloud: $v, profile: "realistic", early_params: "", name: " (realistic)"} else empty end) ]
            + (if $profile == "all" then [{nextcloud: $versions[0], profile: "minimal", early_params: "0", activity: "0", name: " (body parameters win, no Activity app)"}] else [] end)
            + (if $profile == "all" or $profile == "pseudo-language" then [{nextcloud: $versions[0], profile: "minimal", early_params: "1", pseudo: "double", name: " (pseudo-language)"}] else [] end)
            | {include: .}')
          echo "Testing against: $matrix"
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  e2e:
    name: Nextcloud ${{ matrix.nextcloud }}${{ matrix.name }}
    needs: versions
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      NEXTCLOUD_VERSION: ${{ matrix.nextcloud }}
      DECK_VERSION: ${{ inputs.deck }}
      E2E_PROFILE: ${{ matrix.profile }}
      E2E_EARLY_PARAMS: ${{ matrix.early_params }}
      E2E_ACTIVITY: ${{ matrix.activity }}
      # xcodebuild passes TEST_RUNNER_<NAME> to the UI tests as <NAME>; see PseudoLanguage in UITestSupport.swift.
      TEST_RUNNER_E2E_PSEUDO_LANGUAGE: ${{ matrix.pseudo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # 8.4 runs every Nextcloud major still supported (32 needs < 8.5, 35 needs >= 8.3).
          php-version: "8.4"
          extensions: gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip, curl, bcmath, gmp, pdo_mysql, apcu, redis
          ini-values: memory_limit=512M, apc.enable_cli=1
          tools: none

      # setup-php carries on when an extension fails to install (#197): without APCu, the realistic server installs
      # but answers every request with a 500. Try once more, then stop with the missing extensions named.
      - name: Check PHP extensions
        id: php-extensions
        run: scripts/e2e/check-php.sh || echo "missing=true" >> "$GITHUB_OUTPUT"

      - name: Set up PHP again (an extension is missing)
        if: steps.php-extensions.outputs.missing == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip, curl, bcmath, gmp, pdo_mysql, apcu, redis
          ini-values: memory_limit=512M, apc.enable_cli=1
          tools: none

      - name: Check PHP extensions again
        if: steps.php-extensions.outputs.missing == 'true'
        run: scripts/e2e/check-php.sh

      - name: Install Caddy
        run: brew install caddy

      - name: Install nginx, MariaDB and Redis
        if: matrix.profile == 'realistic'
        run: brew install nginx mariadb redis

      - name: Start Nextcloud with Deck
        run: scripts/e2e/start-server.sh

      - name: Trust the test server's certificate
        run: scripts/e2e/trust-ca.sh

      - name: Seed demo data
        run: scripts/e2e/seed.sh

      - name: Show versions
        run: |
          grep -E 'VERSION|PROFILE|EARLY|ACTIVITY' build/e2e/env | tee -a "$GITHUB_STEP_SUMMARY"
          # The test users' passwords are throwaway, but keep them out of the logs anyway.
          for name in E2E_ADMIN_PASSWORD E2E_ALICE_PASSWORD E2E_BOB_PASSWORD; do
            echo "::add-mask::$(grep "^$name=" build/e2e/env | cut -d= -f2-)"
          done

      - name: Select Xcode version
        run: |
          XCODE_PATH=$(ls -td /Applications/Xcode_*.app 2>/dev/null | head -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      # The Swift packages (Sparkle) and the versions they resolved to, kept between runs so most runs don't fetch
      # anything from GitHub (#203). test.sh puts them in build/SourcePackages. Saved by the first job, if it passes.
      - name: Restore the Swift packages
        id: swift-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
            Shuffleboard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          key: ${{ runner.os }}-swift-packages-${{ hashFiles('Shuffleboard.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-swift-packages-

      # GitHub sometimes refuses an unauthenticated clone of Sparkle with a 403 (#203). actions/checkout keeps its
      # token in this repository's git config only; this gives it to git for every github.com fetch, so SwiftPM's
      # clones are authenticated too (test.sh has xcodebuild use git). Removed again at the end of the job.
      - name: Give git the job's token for GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          credentials=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$credentials"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $credentials"

      - name: API tests (DeckAPI and AppState)
        # The pseudo-language changes only what the app shows.
        if: ${{ !matrix.pseudo }}
        run: scripts/e2e/test.sh api

      - name: Allow UI testing
        # Without this, XCUITest can wait for someone to approve "automation mode" and time out.
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: UI tests
        run: scripts/e2e/test.sh ui

      - name: Save the Swift packages
        if: strategy.job-index == 0 && steps.swift-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
            Shuffleboard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}

      # Also on pull requests, so a change to the UI can be looked at in the run's artifacts. In the pseudo-language,
      # with Settings and About too, to look for text that is cut off, even if a UI test failed.
      - name: Screenshots
        if: >-
          (success() && strategy.job-index == 0 && matrix.profile == 'minimal' && !matrix.pseudo)
          || (!cancelled() && matrix.pseudo)
        env:
          E2E_SCREENSHOTS_DIR: ${{ matrix.pseudo && 'build/screenshots-pseudo-language' || 'docs/screenshots' }}
        run: |
          # The runner's screen is small: keep the Dock from covering the bottom of the window.
          defaults write com.apple.dock autohide -bool true
          killall Dock
          sleep 2
          scripts/e2e/test.sh screenshots

      - name: Upload screenshots
        if: strategy.job-index == 0 && matrix.profile == 'minimal' && !matrix.pseudo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: error

      - name: Upload pseudo-language screenshots
        if: ${{ !cancelled() && matrix.pseudo }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-pseudo-language
          path: build/screenshots-pseudo-language
          if-no-files-found: warn

      # Also when a test only passed on another try (test.sh writes build/<kind>-retried.txt), to see why it failed.
      - name: Upload server logs and test results
        if: failure() || (!cancelled() && hashFiles('build/*-retried.txt') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nextcloud-${{ matrix.nextcloud }}-${{ matrix.profile }}-${{ matrix.early_params || 'apps' }}${{ matrix.pseudo && '-pseudo-language' || '' }}
          path: |
            build/e2e/logs
            build/*.xcresult
            build/*-retried.txt
          if-no-files-found: ignore

      - name: Stop the server
        if: always()
        run: scripts/e2e/stop-server.sh

      - name: Take the token back from git
        if: always()
        run: git config --global --unset-all http.https://github.com/.extraheader || true

  screenshots-pr:
    name: Open screenshots pull request
    needs: e2e
    if: inputs.screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: docs/screenshots

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/screenshots && [ -z "$(git ls-files --others --exclude-standard docs/screenshots)" ]; then
            echo "Screenshots unchanged"
            exit 0
          fi
          branch="docs/screenshots-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/screenshots
          git commit -m "docs: update README screenshots"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: update README screenshots" \
            --body "Screenshots taken by the end-to-end UI tests from the seeded demo data (light and dark mode), run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Pull requests opened by GitHub Actions don't start CI on their own: close and reopen this one to run it."
